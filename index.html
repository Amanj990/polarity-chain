<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Polarity Chain</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
  html,body{height:100%;margin:0;background:#050819;color:#dfe7ff;font-family:'Orbitron', sans-serif;overflow:hidden;touch-action:none;}
  canvas{display:block;background:linear-gradient(180deg,#06101a,#041018);}
  
  #ui{position:fixed;left:15px;top:15px;z-index:10; font-size: 18px;}
  #pol{position:fixed;right:15px;top:15px;padding:8px 15px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid #00f2ff;}
  #powerups{position:fixed;left:15px;bottom:15px;display:flex;gap:12px;font-size:14px;}

  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:rgba(0,0,0,0.85);transition: opacity 0.4s;}
  .card{
    background:rgba(6,8,12,0.98);padding:40px;border-radius:20px;text-align:center;border:1px solid #1f6feb;
    box-shadow: 0 0 30px rgba(31,111,235,0.4);
    animation: scaleIn 0.5s ease-out;
  }
  @keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  
  #mTitle {
    color:#00f2ff; margin:0 0 20px 0; font-size: 2.5em;
    text-shadow: 0 0 10px #00f2ff;
    animation: glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow { from { text-shadow: 0 0 10px #00f2ff, 0 0 20px #00f2ff; } to { text-shadow: 0 0 20px #00f2ff, 0 0 40px #1f6feb; } }

  button{
    padding:14px 30px; border-radius:10px; border:0; background:#1f6feb; color:#fff; 
    font-family:'Orbitron'; font-weight:700; margin:10px; cursor:pointer;
    transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  button:hover { transform: translateY(-3px); background: #2684ff; box-shadow: 0 0 15px #1f6feb; }
  
  #instrModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(0,0,0,0.95);}

  .score-pop {
    position: absolute; font-weight: bold; pointer-events: none;
    animation: floatUp 1s ease-out forwards;
  }
  @keyframes floatUp { 0% { transform: translateY(0); opacity:1; } 100% { transform: translateY(-50px); opacity:0; } }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="ui">SCORE: <span id="score">0</span></div>
<div id="pol"><span id="polTxt" style="color:#00f2ff">N</span></div>

<div id="powerups">
  <span>🛡️ <span id="sVal">0</span></span>
  <span>⚡ <span id="bVal">0</span></span>
  <span>🐌 <span id="slVal">0</span></span>
</div>

<div id="overlay">
  <div class="card">
    <h1 id="mTitle">POLARITY CHAIN</h1>
    <div id="res" style="display:none;margin-bottom:20px;">
      <p style="font-size:1.2em;">MISSION SCORE: <span id="lScore" style="color:#00f2ff">0</span></p>
      <p style="font-size:1em; opacity:0.8;">BEST RECORD: <span id="hScore">0</span></p>
    </div>
    <button id="startBtn">START MISSION</button>
    <button id="instrBtn" style="background:transparent; border:1px solid #2ecc71; color:#2ecc71;">INSTRUCTIONS</button>
  </div>
</div>

<div id="instrModal">
  <div class="card" style="border-color:#2ecc71;">
    <h2 style="color:#2ecc71;">MISSION DATA</h2>
    <p style="text-align:left;font-size:14px;line-height:1.6;">
      - Match Polarity (N-N, S-S) to chain.<br>
      - Chain hit: -1 Score & -1 Chain Length.<br>
      - Magnet Head hit: GAME OVER.<br>
      - Collect ⚡ (Boost), 🐌 (Snail), 🛡️ (Shield).
    </p>
    <button id="closeInstr">BACK</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth, H = window.innerHeight;
  canvas.width = W; canvas.height = H;

  const COLORS = { N: '#00f2ff', S: '#ff007f', boost: '#f1c40f', slow: '#9b59b6', shield: '#2ecc71' };
  let running = false, score = 0, hiScore = localStorage.getItem('hi') || 0;

  const audio = new (window.AudioContext || window.webkitAudioContext)();
  function tone(f, t, d) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = t; o.frequency.value = f; g.gain.value = 0.1;
    o.connect(g); g.connect(audio.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d); o.stop(audio.currentTime + d);
  }

  const magnetImg = new Image(); magnetImg.src = 'magnet.png';
  const magnet = { x: 120, y: H/2, tx: 120, ty: H/2, pol: 'N', shield: 0, boost: 0, slow: 0 };
  let chain = [], elements = [], hazards = [], powerItems = [];

  function pop(x, y, txt, col) {
    const d = document.createElement('div'); d.className = 'score-pop';
    d.style.left = x+'px'; d.style.top = y+'px'; d.style.color = col;
    d.textContent = txt; document.body.appendChild(d);
    setTimeout(()=>d.remove(), 1000);
  }

  function endGame() {
    running = false; if(score > hiScore) { hiScore = score; localStorage.setItem('hi', hiScore); }
    document.getElementById('mTitle').textContent = "MISSION FAILED";
    document.getElementById('res').style.display = "block";
    document.getElementById('lScore').textContent = score;
    document.getElementById('hScore').textContent = hiScore;
    document.getElementById('startBtn').textContent = "RETRY";
    document.getElementById('overlay').style.display = 'flex';
    tone(100, 'sawtooth', 0.5);
  }

  function createHazard() {
    let pts = [];
    let size = 20 + Math.random() * 25;
    let steps = 5 + Math.floor(Math.random() * 5);
    for(let i=0; i<steps; i++) {
        let ang = (i/steps) * Math.PI * 2;
        let r = size * (0.6 + Math.random() * 0.4);
        pts.push({x: Math.cos(ang)*r, y: Math.sin(ang)*r});
    }
    return {x: W+50, y: Math.random()*H, pts: pts, size: size};
  }

  function update() {
    let spd = (1 + (magnet.boost > 0 ? 0.8 : 0)) * (magnet.slow > 0 ? 0.5 : 1);
    magnet.x += (magnet.tx - magnet.x) * 0.15;
    magnet.y += (magnet.ty - magnet.y) * 0.15;

    elements.forEach((el, i) => {
      el.x -= 4 * spd;
      if(!el.attached && Math.hypot(el.x - magnet.x, el.y - magnet.y) < 45 && el.pole === magnet.pol) {
        el.attached = true; chain.push(el);
        score += (magnet.boost > 0 ? 2 : 1);
        tone(600, 'sine', 0.1); pop(el.x, el.y, "+1", COLORS[el.pole]);
      }
      if(el.x < -50) elements.splice(i,1);
    });

    powerItems.forEach((p, i) => {
      p.x -= 5 * spd;
      if(Math.hypot(p.x - magnet.x, p.y - magnet.y) < 40) {
        magnet[p.type] = 300; 
        powerItems.splice(i, 1);
        tone(800, 'sine', 0.2); pop(p.x, p.y, p.type.toUpperCase(), COLORS[p.type]);
      }
      if(p.x < -50) powerItems.splice(i,1);
    });

    hazards.forEach((h, i) => {
      h.x -= 6 * spd;
      
      // Hit Head Logic
      if(Math.hypot(h.x - magnet.x, h.y - magnet.y) < h.size + 15) {
        if(magnet.shield > 0) { magnet.shield = 0; hazards.splice(i,1); tone(200, 'square', 0.3); }
        else endGame();
        return;
      }

      // Hit Chain Logic: -1 score & remove element
      chain.forEach((l, li) => {
        if(Math.hypot(h.x - l.x, h.y - l.y) < h.size + 10) {
          score = Math.max(0, score - 1);
          pop(l.x, l.y, "-1", "#ff4444");
          tone(150, 'square', 0.1);
          chain.splice(li, 1);
          hazards.splice(i, 1);
        }
      });

      if(h.x < -100) hazards.splice(i,1);
    });

    chain.forEach((l, i) => {
      const p = i === 0 ? magnet : chain[i-1];
      const d = Math.hypot(l.x - p.x, l.y - p.y);
      if(d > 30) { l.x = p.x + (l.x-p.x)*30/d; l.y = p.y + (l.y-p.y)*30/d; }
    });

    if(magnet.boost > 0) magnet.boost--; if(magnet.slow > 0) magnet.slow--;
    if(Math.random() < 0.03) elements.push({x:W+50, y:Math.random()*H, pole:Math.random()>0.5?'N':'S', attached:false});
    if(Math.random() < 0.012) hazards.push(createHazard());
    if(Math.random() < 0.0035) {
        const types = ['shield', 'boost', 'slow'];
        powerItems.push({x:W+50, y:Math.random()*H, type: types[Math.floor(Math.random()*3)]});
    }

    document.getElementById('score').textContent = score;
    document.getElementById('sVal').textContent = magnet.shield > 0 ? "ON" : "0";
    document.getElementById('bVal').textContent = Math.ceil(magnet.boost/60);
    document.getElementById('slVal').textContent = Math.ceil(magnet.slow/60);
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    elements.forEach(el => {
      ctx.fillStyle = COLORS[el.pole]; ctx.beginPath(); ctx.arc(el.x, el.y, 15, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Orbitron'; ctx.fillText(el.pole, el.x-6, el.y+5);
    });
    powerItems.forEach(p => {
      ctx.fillStyle = COLORS[p.type]; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '16px serif'; 
      const icon = p.type === 'shield' ? '🛡️' : p.type === 'boost' ? '⚡' : '🐌';
      ctx.fillText(icon, p.x-10, p.y+7);
    });
    ctx.fillStyle = '#ff4444';
    hazards.forEach(h => {
        ctx.beginPath(); ctx.moveTo(h.x + h.pts[0].x, h.y + h.pts[0].y);
        for(let i=1; i<h.pts.length; i++) ctx.lineTo(h.x + h.pts[i].x, h.y + h.pts[i].y);
        ctx.closePath(); ctx.fill();
    });
    ctx.save(); ctx.translate(magnet.x, magnet.y);
    if(magnet.shield > 0) { ctx.strokeStyle=COLORS.shield; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,45,0,Math.PI*2); ctx.stroke(); }
    if(magnetImg.complete) ctx.drawImage(magnetImg, -25, -25, 50, 50);
    else { ctx.fillStyle=COLORS[magnet.pol]; ctx.fillRect(-20,-10,40,20); }
    ctx.restore();
  }

  function loop() { if(running) update(); draw(); requestAnimationFrame(loop); }
  loop();

  window.onpointermove = (e) => { magnet.tx = e.clientX; magnet.ty = e.clientY; };
  window.onpointerdown = (e) => {
    if(!running) return;
    if(audio.state === 'suspended') audio.resume();
    magnet.pol = magnet.pol === 'N' ? 'S' : 'N';
    document.getElementById('polTxt').textContent = magnet.pol;
    document.getElementById('polTxt').style.color = COLORS[magnet.pol];
    tone(450, 'triangle', 0.05);
  };

  document.getElementById('startBtn').onclick = () => { score=0; chain=[]; elements=[]; hazards=[]; powerItems=[]; running=true; document.getElementById('overlay').style.display='none'; };
  document.getElementById('instrBtn').onclick = () => { document.getElementById('instrModal').style.display='flex'; };
  document.getElementById('closeInstr').onclick = () => { document.getElementById('instrModal').style.display='none'; };
  window.onresize = () => { W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; };
})();
</script>
</body>
</html>
